# Repo-local checks carried through from vendored lefthook.yml (#126).
---

pre-commit:
  commands:
    bats-parse:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_PARSE_TIMEOUT:-30} bats -c {staged_files}
    nix-flake-check:
      glob: "**/*.nix"
      run: timeout ${LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT:-60} nix flake check
    taplo-lint:
      glob: "**/*.toml"
      run: timeout ${LEFTHOOK_TAPLO_LINT_TIMEOUT:-30} taplo check {staged_files}
    bats-unit:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_UNIT_TIMEOUT:-120} lefthook-bats-unit {staged_files}

pre-push:
  commands:
    bats-unit:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_UNIT_TIMEOUT:-120} lefthook-bats-unit {push_files}
    bats-parse:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_PARSE_TIMEOUT:-30} bats -c {push_files}
    nix-flake-check:
      glob: "**/*.nix"
      run: timeout ${LEFTHOOK_NIX_FLAKE_CHECK_TIMEOUT:-60} nix flake check
    taplo-lint:
      glob: "**/*.toml"
      run: timeout ${LEFTHOOK_TAPLO_LINT_TIMEOUT:-30} taplo check {all_files}
